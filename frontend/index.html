<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight — Client Intelligence</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#162033;--muted:#6d7890;--line:#e6eaf1;--blue:#315efb;--blue2:#eaf0ff;--green:#17845b;--red:#c83b4b;--amber:#a66b00;--shadow:0 10px 30px rgba(20,34,70,.06)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;padding:4px 10px 28px}.brand span{color:#6f91ff}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aeb8ca;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#202a3b;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:700}.title{font-size:30px;font-weight:800;margin:5px 0}.subtitle{color:var(--muted);font-size:14px}.pill{padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(5,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.kpi-label{font-size:12px;color:var(--muted)}.kpi-value{font-size:25px;font-weight:800;margin-top:8px}.kpi-note{font-size:11px;color:var(--muted);margin-top:4px}.two{grid-template-columns:1.3fr .7fr;margin-top:16px}.three{grid-template-columns:repeat(3,1fr);margin-top:16px}.section-title{font-weight:700;margin-bottom:15px}.chartbox{height:250px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:13px 11px;border-bottom:1px solid var(--line)}.table tr{cursor:pointer}.table tbody tr:hover{background:#fafbfe}.risk,.segment{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.low{background:#e8f7f0;color:var(--green)}.medium{background:#fff4d9;color:var(--amber)}.high{background:#fdebed;color:var(--red)}.segment{background:var(--blue2);color:var(--blue)}.money{font-variant-numeric:tabular-nums}.modal{position:fixed;inset:0;background:rgba(12,18,32,.45);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:24px}.close{float:right;border:0;background:#f1f3f7;border-radius:50%;width:32px;height:32px;cursor:pointer}.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:13px;background:#f7f9fc;border-radius:10px}.metric small{color:var(--muted);display:block}.metric b{font-size:18px}.sim{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.sim input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.rec{margin-top:14px;padding:13px;border-radius:10px;background:#f4f7ff}.muted{color:var(--muted)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}}@media(max-width:700px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:20px}.profile{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Fin<span>Sight</span></div><div class="nav"><button class="active" data-view="dashboard">Overview</button><button data-view="clients">Clients</button><button data-view="simulator">Decision Simulator</button><button data-view="audit">Audit Trail</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Enterprise financial intelligence</div><div class="title" id="pageTitle">Portfolio Overview</div><div class="subtitle">Profitability, credit risk and client segmentation in one decision layer.</div></div><div class="pill" id="apiStatus">Connecting…</div></div><section id="dashboard"></section><section id="clients" style="display:none"></section><section id="simulator" style="display:none"></section><section id="audit" style="display:none"></section></main></div><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><script>
const API=(window.FINSIGHT_API||'').replace(/\/$/,'');let clients=[];let dashboardData=null;let selected=null;
const fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n);const money=n=>'₹'+fmt(n);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt){let r=await fetch(API+path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function demo(){return Array.from({length:60},(_,i)=>{let rev=1400000+((i+1)*137921)%1200000,cost=450000+((i+1)*81731)%550000,risk=8+((i+1)*23)%88,exp=100000+((i+1)*43127)%650000;let level=risk<35?'LOW':risk<65?'MEDIUM':'HIGH';let seg=rev-cost>1300000&&risk<35?'PREMIUM':risk>=65?'HIGH_RISK':'STANDARD';return {id:String(i+1),client_code:`CL-${String(i+1).padStart(4,'0')}`,name:`Client ${String(i+1).padStart(3,'0')}`,industry:['Technology','Healthcare','Manufacturing','Retail','Financial Services','Logistics'][i%6],annual_revenue:rev,annual_cost:cost,credit_exposure:exp,profitability_score:Math.min(100,Math.max(0,(rev-cost)/25000)),risk_score:risk,risk_level:level,segment:seg,status:'ACTIVE'}})}
async function load(){try{dashboardData=await api('/api/dashboard');clients=await api('/api/clients');document.getElementById('apiStatus').textContent='Live • Supabase';}catch(e){clients=demo();dashboardData=calc(clients);document.getElementById('apiStatus').textContent='Demo mode • backend pending';}}
function calc(d){let rev=d.reduce((a,x)=>a+x.annual_revenue,0),cost=d.reduce((a,x)=>a+x.annual_cost,0);return {total_clients:d.length,total_revenue:rev,total_cost:cost,total_profit:rev-cost,avg_risk:d.reduce((a,x)=>a+x.risk_score,0)/d.length,high_risk:d.filter(x=>x.risk_level==='HIGH').length,medium_risk:d.filter(x=>x.risk_level==='MEDIUM').length,low_risk:d.filter(x=>x.risk_level==='LOW').length,segments:d.reduce((a,x)=>(a[x.segment]=(a[x.segment]||0)+1,a),{}),industries:d.reduce((a,x)=>(a[x.industry]=(a[x.industry]||0)+1,a),{})}}
function renderDashboard(){let d=dashboardData||calc(clients);document.getElementById('dashboard').innerHTML=`<div class="grid kpis"><div class="card"><div class="kpi-label">Total clients</div><div class="kpi-value">${d.total_clients}</div><div class="kpi-note">Active portfolio</div></div><div class="card"><div class="kpi-label">Portfolio revenue</div><div class="kpi-value money">${money(d.total_revenue)}</div><div class="kpi-note">Annualized</div></div><div class="card"><div class="kpi-label">Portfolio profit</div><div class="kpi-value money">${money(d.total_profit)}</div><div class="kpi-note">Revenue − cost</div></div><div class="card"><div class="kpi-label">Average risk</div><div class="kpi-value">${Number(d.avg_risk).toFixed(1)}</div><div class="kpi-note">Out of 100</div></div><div class="card"><div class="kpi-label">High-risk clients</div><div class="kpi-value">${d.high_risk}</div><div class="kpi-note">Requires attention</div></div></div><div class="grid two"><div class="card"><div class="section-title">Risk distribution</div><div class="chartbox"><canvas id="riskChart"></canvas></div></div><div class="card"><div class="section-title">Segments</div><div class="chartbox"><canvas id="segChart"></canvas></div></div></div><div class="card" style="margin-top:16px"><div class="section-title">Priority clients</div><div class="table-wrap">${table(clients.slice().sort((a,b)=>b.risk_score-a.risk_score).slice(0,8))}</div></div>`;new Chart(document.getElementById('riskChart'),{type:'doughnut',data:{labels:['Low','Medium','High'],datasets:[{data:[d.low_risk,d.medium_risk,d.high_risk]}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});new Chart(document.getElementById('segChart'),{type:'doughnut',data:{labels:Object.keys(d.segments),datasets:[{data:Object.values(d.segments)}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}
function table(rows){return `<table class="table"><thead><tr><th>Client</th><th>Industry</th><th>Profit</th><th>Risk</th><th>Segment</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="openClient('${x.id}')"><td><b>${esc(x.client_code)}</b><br><span class="muted">${esc(x.name)}</span></td><td>${esc(x.industry)}</td><td>${money(x.annual_revenue-x.annual_cost)}</td><td><span class="risk ${x.risk_level.toLowerCase()}">${x.risk_level} · ${Number(x.risk_score).toFixed(0)}</span></td><td><span class="segment">${x.segment}</span></td></tr>`).join('')}</tbody></table>`}
function renderClients(){document.getElementById('clients').innerHTML=`<div class="card"><div class="toolbar"><input id="search" placeholder="Search client, code or industry…"><select id="risk"><option value="">All risk</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select><select id="seg"><option value="">All segments</option><option>PREMIUM</option><option>STANDARD</option><option>HIGH_RISK</option></select></div><div id="clientTable">${table(clients)}</div></div>`;['search','risk','seg'].forEach(id=>document.getElementById(id).oninput=filterClients)}
function filterClients(){let s=document.getElementById('search').value.toLowerCase(),r=document.getElementById('risk').value,g=document.getElementById('seg').value;let rows=clients.filter(x=>(!s||`${x.name} ${x.client_code} ${x.industry}`.toLowerCase().includes(s))&&(!r||x.risk_level===r)&&(!g||x.segment===g));document.getElementById('clientTable').innerHTML=table(rows)}
function renderSimulator(){document.getElementById('simulator').innerHTML=`<div class="card"><div class="section-title">What-if credit exposure simulator</div><p class="muted">Select a client and test how a credit-limit change could affect revenue, profit and risk.</p><div class="toolbar"><select id="simClient">${clients.map(x=>`<option value="${x.id}">${esc(x.client_code)} — ${esc(x.name)}</option>`).join('')}</select></div><div class="sim"><div><label class="muted">Credit limit change (%)</label><input id="change" type="number" value="20" min="-50" max="100"></div><button class="primary" onclick="runSim()">Run simulation</button></div><div id="simResult"></div></div>`}
async function runSim(){let id=document.getElementById('simClient').value,change=Number(document.getElementById('change').value),c=clients.find(x=>x.id===id);try{let r=await api(`/api/clients/${id}/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credit_limit_change_pct:change})});showSim(c,r)}catch(e){let rev=c.annual_revenue*(1+.18*change/100),cost=c.annual_cost*(1+.1*Math.abs(change/100)+.06*Math.max(change/100,0)),risk=Math.min(100,c.risk_score+28*change/100),r={projected_revenue:rev,projected_cost:cost,projected_profit:rev-cost,projected_risk_score:risk,recommendation:risk>=75?'DECLINE — projected risk exceeds the high-risk threshold.':risk>=55?'MANUAL REVIEW — attractive economics but elevated risk.':'APPROVE WITH MONITORING — acceptable trade-off.'};showSim(c,r)}}
function showSim(c,r){document.getElementById('simResult').innerHTML=`<div class="profile"><div class="metric"><small>Projected revenue</small><b>${money(r.projected_revenue)}</b></div><div class="metric"><small>Projected cost</small><b>${money(r.projected_cost)}</b></div><div class="metric"><small>Projected profit</small><b>${money(r.projected_profit)}</b></div><div class="metric"><small>Projected risk</small><b>${Number(r.projected_risk_score).toFixed(1)}/100</b></div></div><div class="rec"><b>Decision recommendation</b><br>${esc(r.recommendation)}</div>`}
function renderAudit(){document.getElementById('audit').innerHTML=`<div class="card"><div class="section-title">Audit trail</div><p class="muted">Every decision simulation is recorded for traceability. Use the backend deployment to view live audit events.</p><div class="profile"><div class="metric"><small>Enterprise control</small><b>Auditability</b></div><div class="metric"><small>Decision layer</small><b>Scenario-based</b></div><div class="metric"><small>Data layer</small><b>PostgreSQL</b></div><div class="metric"><small>API</small><b>REST / FastAPI</b></div></div></div>`}
async function openClient(id){try{let r=await api('/api/clients/'+id);selected=r.client;showClient(r)}catch(e){selected=clients.find(x=>x.id===id);showClient({client:selected,risk_factors:[],simulations:[]})}}
function showClient(r){let c=r.client;document.getElementById('modalContent').innerHTML=`<div class="eyebrow">Client 360</div><h2>${esc(c.client_code)} — ${esc(c.name)}</h2><p class="muted">${esc(c.industry)} · ${esc(c.email||'No email')}</p><div class="profile"><div class="metric"><small>Annual revenue</small><b>${money(c.annual_revenue)}</b></div><div class="metric"><small>Annual cost</small><b>${money(c.annual_cost)}</b></div><div class="metric"><small>Profit</small><b>${money(c.annual_revenue-c.annual_cost)}</b></div><div class="metric"><small>Credit exposure</small><b>${money(c.credit_exposure)}</b></div><div class="metric"><small>Risk score</small><b>${Number(c.risk_score).toFixed(1)}</b></div><div class="metric"><small>Risk level</small><b>${c.risk_level}</b></div><div class="metric"><small>Profitability score</small><b>${Number(c.profitability_score).toFixed(1)}</b></div><div class="metric"><small>Segment</small><b>${c.segment}</b></div></div><h3>Decision support</h3><p class="muted">Use the simulator to test a credit-exposure change before acting.</p><button class="primary" onclick="closeModal();switchView('simulator');document.getElementById('simClient').value='${c.id}'">Open simulator</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function switchView(v){document.querySelectorAll('main section').forEach(x=>x.style.display='none');document.getElementById(v).style.display='block';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('pageTitle').textContent={dashboard:'Portfolio Overview',clients:'Client Portfolio',simulator:'Decision Simulator',audit:'Audit Trail'}[v]}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
(async()=>{await load();renderDashboard();renderClients();renderSimulator();renderAudit()})();
</script></body></html>
